<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#22427A"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body>
<title>Nihongo Harian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one-column phone app; content screens scroll above a fixed bottom tab bar; lessons open as a full-screen layer. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --line:#D5DCE7;
  --fg:#1A2233; --muted:#5C6880;
  --ai:#22427A;        /* ai-iro indigo: primary */
  --ai-soft:#DCE4F2;
  --shu:#C8402F;       /* shu vermilion: hanko stamp, streak */
  --good:#2F7D5B; --good-soft:#DCEFE5;
  --bad:#B53A3A; --bad-soft:#F6E0DE;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141C; --surface:#181E29; --surface-2:#222A38; --line:#2E3747;
  --fg:#E6EAF2; --muted:#9AA5BA; --ai:#8FB0EA; --ai-soft:#24324D;
  --shu:#EE7A66; --good:#6CC79C; --good-soft:#1C3529; --bad:#EC8C84; --bad-soft:#3A2224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#181E29; --surface-2:#222A38; --line:#2E3747;
  --fg:#E6EAF2; --muted:#9AA5BA; --ai:#8FB0EA; --ai-soft:#24324D;
  --shu:#EE7A66; --good:#6CC79C; --good-soft:#1C3529; --bad:#EC8C84; --bad-soft:#3A2224; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.jp{font-family:var(--f-jp)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-jp);font-weight:900;font-size:26px;letter-spacing:.01em}
h2{font-size:17px;font-weight:700}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--surface-2)}
.btn.primary{background:var(--ai);color:var(--bg)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface-2)}
.chip.shu{background:transparent;border:1.5px solid var(--shu);color:var(--shu)}
.chip.good{background:var(--good-soft);color:var(--good)}

/* Home: today ring */
.today{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:28px;font-weight:700;line-height:1}
.today-info{display:grid;gap:8px;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--muted)}
.stamp{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-jp);font-weight:900;font-size:15px;border:1.5px dashed var(--line);color:transparent}
.stamp.part{border-style:solid;border-color:var(--ai-soft);background:var(--ai-soft)}
.stamp.full{border:2px solid var(--shu);color:var(--shu);transform:rotate(-8deg)}
.stamp.now{outline:2px solid var(--ai);outline-offset:2px}

.action{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px}
.action .glyph{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--ai-soft);color:var(--ai);font-family:var(--f-jp);font-weight:900;font-size:24px}
.action .txt{min-width:0;display:grid;gap:2px}
.action .txt b{font-weight:700}
.action .go{margin-left:auto;color:var(--muted);font-size:20px}

/* Lesson list */
.unit{display:grid;gap:10px}
.unit-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lesson{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.lesson .ico{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:19px;background:var(--surface-2)}
.lesson.done .ico{background:var(--good-soft);color:var(--good)}
.lesson .meta{font-size:13px;color:var(--muted)}
.lesson.locked{opacity:.55;cursor:default}
.lesson .txt{min-width:0;flex:1}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.chart svg{width:100%;height:auto;display:block}
.hist{display:grid;gap:0}
.hist-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}
.hist-row:first-child{border-top:0}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab .k{font-family:var(--f-jp);font-size:19px;font-weight:700;line-height:1.2}
.tab[aria-current="page"]{color:var(--ai)}

/* Lesson / review layer */
.layer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer-top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai);border-radius:99px;transition:width .25s}
.layer-body{flex:1;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
.layer-body>div{max-width:520px;margin:0 auto;display:grid;gap:16px}
.layer-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.layer-foot>div{max-width:520px;margin:0 auto}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 16px;display:grid;gap:10px;justify-items:center;text-align:center}
.flash .glyph{font-family:var(--f-jp);font-weight:700;font-size:min(30vw,120px);line-height:1.1;color:var(--fg)}
.flash .glyph.word{font-size:min(12vw,48px)}
.flash .romaji{font-size:20px;font-weight:600;color:var(--ai)}
.flash .tip{font-size:14px;color:var(--muted);max-width:34ch}
.speak{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 16px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 10px;font-weight:600;font-size:17px;min-height:60px}
.opt.jp{font-size:22px}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.feedback{border-radius:12px;padding:12px 14px;font-weight:600}
.feedback.right{background:var(--good-soft);color:var(--good)}
.feedback.wrong{background:var(--bad-soft);color:var(--bad)}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding-top:24px}
.result .score{font-size:56px;font-weight:700;line-height:1}
.hanko{width:96px;height:96px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);display:grid;place-items:center;font-family:var(--f-jp);font-weight:900;font-size:34px;transform:rotate(-10deg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.syncnote{font-size:12px;color:var(--muted);text-align:center}
.lesson-row{display:flex;gap:8px;align-items:stretch}
.lesson-row .lesson{flex:1;min-width:0}
.lesson-mic{flex:none;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--ai);display:grid;place-items:center}
.lesson-mic svg{width:24px;height:24px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--ai);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 0 var(--ai-soft)}
.mic.on{animation:pulse 1.2s infinite}
.mic:disabled:not(.on){opacity:.4}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ai-soft)}100%{box-shadow:0 0 0 22px transparent}}
.ktable{display:grid;gap:6px}
.krow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kcell{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:grid;justify-items:center;gap:0}
.kcell .jp{font-size:24px;font-weight:700;line-height:1.3}
.kcell small{color:var(--muted);font-size:11px}
summary.unit-head{cursor:pointer;list-style:none;padding:4px 0}
summary.unit-head::-webkit-details-marker{display:none}
summary.unit-head h2::before{content:"▸";display:inline-block;margin-right:8px;color:var(--muted);transition:transform .15s}
details[open]>summary.unit-head h2::before{transform:rotate(90deg)}
.unit-body{display:grid;gap:10px;padding-top:8px}
.plan-item{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.plan-item .jp{font-weight:700;color:var(--ai);min-width:1.4em}
.reading{font-size:15px;color:var(--muted);letter-spacing:.05em}
.readings{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.readings span{display:grid;justify-items:center}
.readings small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.readings b{font-size:17px}
.example{display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.pattern{font-size:22px;font-weight:900;color:var(--ai)}
.blank{color:var(--ai);border-bottom:2px solid var(--ai)}
.opt.long{font-size:14px}
.boxes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.boxes div{background:var(--surface-2);border-radius:8px;padding:6px 0;display:grid}
.boxes b{font-size:17px}
.boxes span{font-size:10.5px;color:var(--muted)}
.action:disabled{opacity:1}
.linkbtn{border:0;background:none;padding:0;color:var(--ai);text-decoration:underline;font:inherit}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px}
.scene .jp{font-family:var(--f-jp);font-weight:700;color:var(--ai);font-size:15px}
.scene .muted{font-size:12.5px}
.chat{display:grid;gap:10px}
.bub{max-width:88%;border-radius:16px;padding:10px 14px;display:grid;gap:6px;min-width:0;overflow-wrap:anywhere}
.bub.ai{background:var(--surface);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:4px}
.bub.me{background:var(--ai);color:var(--bg);justify-self:end;border-bottom-right-radius:4px;font-family:var(--f-jp);font-size:17px}
.bub.typing{color:var(--muted);font-size:22px;letter-spacing:.2em}
.bub summary{cursor:pointer;font-size:13px;color:var(--muted)}
.bub .speak{padding:5px 12px;font-size:13px}
.corr{background:var(--bad-soft);color:var(--fg);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:14px}
.corr s{color:var(--bad)}
.praise{background:var(--good-soft);color:var(--good);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;justify-self:end;max-width:88%}
.hint{border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.talkbar{display:flex;gap:8px;align-items:flex-end}
.talkbar textarea{flex:1;min-width:0;font:inherit;font-size:16px;font-family:var(--f-jp);resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--fg);max-height:120px}
.mic.small{width:46px;height:46px;flex:none}
.mic.small svg{width:22px;height:22px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.today{grid-template-columns:1fr;justify-items:center}.today-info{justify-items:center;text-align:center}}
</style>

 ex:[["にほんへ いきたいです。","Saya ingin pergi ke Jepang."],["きょうは なにも たべたくないです。","Hari ini saya tidak ingin makan apa pun."]],
 q:[["すしを ＿です。","たべたい","たべますたい,たべるたい,たべたいます","Saya ingin makan sushi."],["にほんごを ＿です。","はなしたい","はなすたい,はなしたいます,はなしまたい","Saya ingin bisa berbahasa Jepang."],["きょうは ＿です。(tidak ingin pergi)","いきたくない","いかないたい,いきたいない,いきたくありますん","Hari ini saya tidak ingin pergi."],["なにが ＿ですか。","のみたい","のむたい,のみます,のんだい","Mau minum apa?"]]},
{id:"mashou", title:"Ajakan: ましょう・ませんか", pattern:"V ましょう / V ませんか",
 explain:"ましょう = 'mari/ayo kita...'. ませんか = ajakan sopan 'maukah...?'. Jawab ajakan dengan ええ、いいですね.",
 ex:[["いっしょに たべましょう。","Ayo makan bersama."],["こんど えいがを みませんか。","Maukah kita menonton film lain kali?"]],
 q:[["いっしょに かえり＿。","ましょう","ませんでした,たい,ました","Ayo pulang bersama."],["コーヒーを のみ＿か。","ません","ます,ました,ましょう","Maukah minum kopi?"],["ちょっと やすみ＿。","ましょう","ませんでした,たいです,ません","Mari istirahat sebentar."],["ええ、＿ですね。","いい","よく,よかった,いく","Ya, boleh juga."]]},
{id:"te-kudasai", title:"Permintaan: てください", pattern:"V-て ください",
 explain:"Bentuk て + ください = 'tolong lakukan'. Cara membuat bentuk て: たべます→たべて, みます→みて, かきます→かいて, よみます→よんで, いきます→いって, します→して.",
 ex:[["ここに なまえを かいてください。","Tolong tulis nama di sini."],["ゆっくり はなしてください。","Tolong bicara pelan-pelan."]],
 q:[["ちょっと ＿ください。(tunggu)","まって","まちて,まつて,まった","Tolong tunggu sebentar."],["この ほんを ＿ください。(baca)","よんで","よみて,よむて,よまて","Tolong baca buku ini."],["まどを ＿ください。(buka: あける)","あけて","あけって,あくて,あけで","Tolong buka jendelanya."],["もう いちど ＿ください。(katakan: いう)","いって","いいて,いうて,いんで","Tolong katakan sekali lagi."]]},
{id:"te-iru", title:"Sedang: ている", pattern:"V-て います",
 explain:"V-て います menyatakan sedang berlangsung (sedang makan) atau keadaan yang berlanjut (tinggal di, sudah menikah).",
 ex:[["いま ごはんを たべています。","Sekarang saya sedang makan."],["ジャカルタに すんでいます。","Saya tinggal di Jakarta."]],
 q:[["いま テレビを ＿います。","みて","みる,みた,みって","Sekarang sedang menonton TV."],["あには ぎんこうで ＿います。","はたらいて","はたらきて,はたらって,はたらくて","Kakak saya bekerja di bank."],["あめが ＿います。(turun: ふる)","ふって","ふりて,ふるて,ふんで","Hujan sedang turun."],["ちちは いま ＿います。(tidur: ねる)","ねて","ねって,ねりて,ねんで","Ayah sedang tidur."]]},
{id:"temo-ii", title:"Boleh: てもいいです", pattern:"V-て も いいですか",
 explain:"V-て も いいです = 'boleh melakukan'. Sebagai pertanyaan: てもいいですか = 'bolehkah saya...?'.",
 ex:[["しゃしんを とっても いいですか。","Bolehkah saya mengambil foto?"],["ここで たべても いいです。","Boleh makan di sini."]],
 q:[["ここに ＿も いいですか。(duduk: すわる)","すわって","すわりて,すわるて,すわった","Bolehkah saya duduk di sini?"],["まどを あけても ＿ですか。","いい","よい,いく,よく","Bolehkah saya membuka jendela?"],["この ペンを ＿も いいですか。(pakai: つかう)","つかって","つかいて,つかうて,つかんで","Bolehkah saya pakai pulpen ini?"],["トイレに いっても いい＿。","ですか","ますか,でした,ません","Bolehkah saya ke toilet?"]]},
{id:"kara", title:"Alasan: から", pattern:"Alasan から、hasil",
 explain:"から setelah kalimat berarti 'karena'. Alasan diletakkan di depan, akibat di belakang.",
 ex:[["あついですから、まどを あけます。","Karena panas, saya membuka jendela."],["じかんが ありませんから、タクシーで いきます。","Karena tidak ada waktu, saya naik taksi."]],
 q:[["さむいです＿、コートを きます。","から","まで,より,ので","Karena dingin, saya memakai mantel."],["あたまが いたいです＿、やすみます。","から","と,を,に","Karena sakit kepala, saya istirahat."],["＿、たべません。(karena tidak lapar)","おなかが すいていませんから","おなかが すいていますから,おなかから,すいていませんまで","Karena tidak lapar, saya tidak makan."],["あした テストが あります＿、べんきょうします。","から","まで,より,けど","Karena besok ada tes, saya belajar."]]},
{id:"yori", title:"Perbandingan: より・のほうが", pattern:"A は B より adj です / A の ほうが adj です",
 explain:"A は B より たかい = A lebih mahal daripada B. Untuk menjawab pilihan: A の ほうが たかいです = A yang lebih mahal.",
 ex:[["でんしゃは バスより はやいです。","Kereta lebih cepat daripada bus."],["なつの ほうが すきです。","Saya lebih suka musim panas."]],
 q:[["にほんは インドネシア＿ さむいです。","より","から,まで,ほう","Jepang lebih dingin daripada Indonesia."],["コーヒーと おちゃと どちらが すきですか。…おちゃの ＿が すきです。","ほう","より,もの,こと","Saya lebih suka teh."],["この かばんは あの かばん＿ やすいです。","より","ほど,のほう,まで","Tas ini lebih murah daripada tas itu."],["やまと うみと ＿が いいですか。","どちら","どれ,どこ,なに","Gunung dan laut, mana yang lebih baik?"]]}
];

</script>
<script>
/* ============================================================
   KURIKULUM — struktur yang akan diisi langkah 2–4.
   kind: "kana" | "vocab" (langkah 3 menambah "kanji", "grammar"; langkah 4 "talk").
   Setiap item punya id unik global supaya statistik benar/salah tersimpan per item.
   ============================================================ */
const KANA_ROWS = [
  ["a","あ a,い i,う u,え e,お o"],["ka","か ka,き ki,く ku,け ke,こ ko"],["sa","さ sa,し shi,す su,せ se,そ so"],
  ["ta","た ta,ち chi,つ tsu,て te,と to"],["na","な na,に ni,ぬ nu,ね ne,の no"],["ha","は ha,ひ hi,ふ fu,へ he,ほ ho"],
  ["ma","ま ma,み mi,む mu,め me,も mo"],["ya","や ya,ゆ yu,よ yo"],["ra","ら ra,り ri,る ru,れ re,ろ ro"],
  ["wa","わ wa,を wo,ん n"],["ga","が ga,ぎ gi,ぐ gu,げ ge,ご go"],["za","ざ za,じ ji,ず zu,ぜ ze,ぞ zo"],
  ["da","だ da,ぢ ji,づ zu,で de,ど do"],["ba","ば ba,び bi,ぶ bu,べ be,ぼ bo"],["pa","ぱ pa,ぴ pi,ぷ pu,ぺ pe,ぽ po"]
];
const KANA_ID = {"ぢ":"di","づ":"du"};          // romaji kembar → id unik
const KANA_TIP = {
  a:"Seperti 'a' pada 'apa'.", i:"Seperti 'i' pada 'ini'.", u:"'u' dengan bibir tidak terlalu bulat.", e:"Seperti 'e' pada 'enak'.", o:"Seperti 'o' pada 'oto'.",
  shi:"Dibaca 'syi', bukan 'si'.", chi:"Dibaca 'ci' seperti pada 'cinta'.", tsu:"Bunyi 'ts' cepat, seperti akhir kata 'cats'.",
  fu:"Antara 'fu' dan 'hu', bibir tidak menempel.", ha:"Sebagai partikel (kata bantu) dibaca 'wa'.", he:"Sebagai partikel dibaca 'e'.",
  wo:"Dibaca 'o'. Hanya dipakai sebagai partikel objek.", n:"Satu-satunya huruf mati. Bunyi 'n' atau 'ng'.",
  ra:"Bunyi 'r' ringan, antara 'r' dan 'l'.", ji:"じ lebih umum. ぢ jarang dipakai.", zu:"ず lebih umum. づ jarang dipakai.",
  ga:"Dua titik (dakuten) membuat bunyi jadi berat: か→が.", pa:"Lingkaran kecil (handakuten) mengubah は jadi ぱ."
};
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
function kanaLessons(script){
  const p = script==="h" ? "h" : "k", name = script==="h" ? "Hiragana" : "Katakana";
  return KANA_ROWS.map(([row,list])=>{
    const items = list.split(",").map(x=>{const [h,r]=x.split(" "); const jp=script==="h"?h:toKata(h);
      return {id:p+":"+(KANA_ID[h]||r), jp, romaji:r, tip:KANA_TIP[r]};});
    return {id:p+"-"+row, kind:"kana", title:name+" "+items.map(i=>i.jp).join(" "), glyph:items[0].jp, items};
  });
}
/* Romaji Hepburn dari kana (untuk kosakata) */
const ROMA={"きゃ":"kya","きゅ":"kyu","きょ":"kyo","しゃ":"sha","しゅ":"shu","しょ":"sho","ちゃ":"cha","ちゅ":"chu","ちょ":"cho","にゃ":"nya","にゅ":"nyu","にょ":"nyo","ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo","みゃ":"mya","みゅ":"myu","みょ":"myo","りゃ":"rya","りゅ":"ryu","りょ":"ryo","ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo","じゃ":"ja","じゅ":"ju","じょ":"jo","びゃ":"bya","びゅ":"byu","びょ":"byo","ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo","ふぁ":"fa","てぃ":"ti","でぃ":"di","ちぇ":"che","しぇ":"she","じぇ":"je"};
KANA_ROWS.forEach(([,list])=>list.split(",").forEach(x=>{const [h,r]=x.split(" "); ROMA[h]=r;})); ROMA["を"]="o"; ROMA["ゔ"]="vu";
"ぁa,ぃi,ぅu,ぇe,ぉo".split(",").forEach(x=>ROMA[x[0]]=x.slice(1));
function toRomaji(kana){
  const h=kana.replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  let out="";
  for(let i=0;i<h.length;i++){
    const two=h.slice(i,i+2), c=h[i];
    if(ROMA[two]&&two.length===2){out+=ROMA[two]; i++; continue;}
    if(c==="っ"){const nx=ROMA[h.slice(i+1,i+3)]||ROMA[h[i+1]]||""; out+=nx.startsWith("ch")?"t":(nx[0]||""); continue;}
    if(c==="ー"){out+=out.slice(-1); continue;}
    if(c==="ん"){out+=/^[aiueoy]/.test(ROMA[h[i+1]]||"")?"n'":"n"; continue;}
    out+=ROMA[c]!=null?ROMA[c]:c;
  }
  return out.replace(/n'/g,"n");
}
function vocabLessons(groups,p){
  return groups.map(([title,txt],gi)=>{
    const items=txt.trim().split("\n").map(line=>{const [jp,kana,arti]=line.split("|"); return {id:p+":"+jp,jp,kana,romaji:toRomaji(kana),arti};});
    return {id:p+"-"+(gi+1),kind:"vocab",title,glyph:items[0].jp.slice(0,1),items};
  });
}
function kanjiLessons(groups,p){
  return groups.map(([title,txt],gi)=>{
    const items=txt.trim().split("\n").map(line=>{const [jp,on,kun,arti,ex,exKana,exArti]=line.split("|");
      return {id:p+":"+jp,jp,on,kun,arti,ex,exKana,exArti,romaji:toRomaji(exKana)};});
    return {id:p+"-"+(gi+1),kind:"kanji",title:"Kanji: "+title,glyph:items[0].jp,items};
  });
}
function grammarLessons(list,p){
  return list.map(g=>({id:p+"-"+g.id,kind:"grammar",title:g.title,glyph:"文",pattern:g.pattern,explain:g.explain,ex:g.ex,
    items:g.q.map((q,i)=>({id:p+":"+g.id+"-"+(i+1),jp:q[0],answer:q[1],distract:q[2].split(","),arti:q[3],romaji:""}))}));
}
const COURSE = [
  { id:"hira", title:"Hiragana", sub:"46 huruf dasar + dakuten", table:"h", lessons:kanaLessons("h") },
  { id:"kata", title:"Katakana", sub:"Untuk kata serapan asing", table:"k", lessons:kanaLessons("k") },
  { id:"salam", title:"Ungkapan dasar", sub:"Kalimat yang dipakai setiap hari", lessons:[
    { id:"v-salam", kind:"vocab", title:"Salam sehari-hari", glyph:"挨", items:[
      {id:"v:ohayou",jp:"おはよう",romaji:"ohayou",arti:"selamat pagi"},
      {id:"v:konnichiwa",jp:"こんにちは",romaji:"konnichiwa",arti:"halo / selamat siang"},
      {id:"v:konbanwa",jp:"こんばんは",romaji:"konbanwa",arti:"selamat malam"},
      {id:"v:sayounara",jp:"さようなら",romaji:"sayounara",arti:"selamat tinggal"}]},
    { id:"v-sopan", kind:"vocab", title:"Terima kasih & maaf", glyph:"礼", items:[
      {id:"v:arigatou",jp:"ありがとう",romaji:"arigatou",arti:"terima kasih"},
      {id:"v:sumimasen",jp:"すみません",romaji:"sumimasen",arti:"permisi / maaf"},
      {id:"v:hai",jp:"はい",romaji:"hai",arti:"ya"},
      {id:"v:iie",jp:"いいえ",romaji:"iie",arti:"tidak / bukan"}]}
  ]},
  { id:"n5v", title:"Kosakata N5", sub:"240 kata per tema", lessons:vocabLessons(window.N5_VOCAB||[],"n5v") },
  { id:"n5k", title:"Kanji N5", sub:"100 kanji dasar", lessons:kanjiLessons(window.N5_KANJI||[],"n5k") },
  { id:"n5g", title:"Tata bahasa N5", sub:"Pola kalimat dasar", lessons:grammarLessons(window.N5_GRAMMAR||[],"n5g") },
  { id:"n4", title:"JLPT N4", sub:"Lanjutan menuju target", lessons:[
    { id:"n4-vocab", kind:"vocab", title:"Kosakata N4", glyph:"語", soon:true },
    { id:"n4-kanji", kind:"kanji", title:"Kanji N4", glyph:"字", soon:true },
    { id:"n4-gram", kind:"grammar", title:"Tata bahasa N4", glyph:"文", soon:true }
  ]},

];
const LESSONS = COURSE.flatMap(u=>u.lessons.map(l=>({...l,unit:u.id})));
const ITEMS = {}; LESSONS.forEach(l=>(l.items||[]).forEach(it=>ITEMS[it.id]={...it,kind:l.kind,lesson:l.id}));

/* RENCANA BELAJAR: urutan yang disarankan, selang-seling kosakata, tata bahasa, dan kanji */
const PACE=6; // pelajaran per minggu (±30 menit/hari)
const PLAN=(()=>{const u=id=>LESSONS.filter(l=>l.unit===id&&!l.soon);
  const out=[...u("hira"),...u("salam"),...u("kata")];
  const v=u("n5v"),g=u("n5g"),k=u("n5k");
  while(v.length||g.length||k.length){ out.push(...v.splice(0,2)); if(g.length) out.push(g.shift()); if(k.length) out.push(k.shift()); }
  return out;})();

/* ============================================================
   DATA — disimpan di perangkat dan (bila tersedia) di akun.
   ============================================================ */
const LS_KEY="nihongo-harian-v1";
const blank=()=>({v:1,goalMin:30,days:{},lessons:{},items:{},srs:{},planStart:null,updatedAt:0});
let S=blank();
try{const raw=localStorage.getItem(LS_KEY); if(raw) S=Object.assign(blank(),JSON.parse(raw));}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const dayRec=k=>S.days[k]||(S.days[k]={sec:0,right:0,wrong:0,lessons:[]});

function merge(a,b){ // gabung dua salinan: ambil nilai terbesar, tidak ada yang hilang
  const m=blank(); m.goalMin=(a.updatedAt>=b.updatedAt?a:b).goalMin||30;
  m.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  m.planStart=[a.planStart,b.planStart].filter(Boolean).sort()[0]||null;
  for(const k of new Set([...Object.keys(a.srs||{}),...Object.keys(b.srs||{})])){
    const x=a.srs?.[k],y=b.srs?.[k]; m.srs[k]=!x?y:!y?x:((x.t||0)>=(y.t||0)?x:y);
  }
  for(const k of new Set([...Object.keys(a.days||{}),...Object.keys(b.days||{})])){
    const x=a.days?.[k]||{},y=b.days?.[k]||{};
    m.days[k]={sec:Math.max(x.sec||0,y.sec||0),right:Math.max(x.right||0,y.right||0),wrong:Math.max(x.wrong||0,y.wrong||0),sRight:Math.max(x.sRight||0,y.sRight||0),sWrong:Math.max(x.sWrong||0,y.sWrong||0),lessons:[...new Set([...(x.lessons||[]),...(y.lessons||[])])]};
  }
  for(const k of new Set([...Object.keys(a.lessons||{}),...Object.keys(b.lessons||{})])){
    const x=a.lessons?.[k]||{},y=b.lessons?.[k]||{};
    m.lessons[k]={times:Math.max(x.times||0,y.times||0),best:Math.max(x.best||0,y.best||0),last:Math.max(x.last||0,y.last||0)};
  }
  for(const k of new Set([...Object.keys(a.items||{}),...Object.keys(b.items||{})])){
    const x=a.items?.[k]||{},y=b.items?.[k]||{};
    const pick=(x.last||0)>=(y.last||0)?x:y;
    m.items[k]={right:Math.max(x.right||0,y.right||0),wrong:Math.max(x.wrong||0,y.wrong||0),streak:pick.streak||0,last:pick.last||0,sRight:Math.max(x.sRight||0,y.sRight||0),sWrong:Math.max(x.sWrong||0,y.sWrong||0)};
  }
  return m;
}

let cloud=null, cloudBusy=false, cloudDirty=false, cloudTimer=null, cloudState="lokal";
function save(urgent){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  cloudDirty=true;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(pushCloud,urgent?500:15000);
}
async function pushCloud(){
  if(!cloud||!cloudDirty||cloudBusy) return;
  cloudBusy=true; cloudDirty=false;
  try{await cloud.set(JSON.parse(JSON.stringify(S))); cloudState="akun";}
  catch(e){cloudDirty=true; cloudState="lokal";}
  cloudBusy=false; if(cloudDirty) cloudTimer=setTimeout(pushCloud,15000);
}
(async()=>{
  try{
    if(!window.claude?.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc("data/users/"+id+"/state");
    const snap=await ref.get();
    if(snap.exists){ S=merge(S,snap.data()); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
    cloud=ref; cloudState="akun"; cloudDirty=true; pushCloud(); render();
  }catch(e){}
})();
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ clearTimeout(cloudTimer); pushCloud(); } });

/* ============================================================
   TIMER BELAJAR — berjalan saat pelajaran/ulangi dibuka atau sesi bebas aktif,
   berhenti otomatis saat aplikasi ditutup/di latar belakang.
   ============================================================ */
let freeSession=false, inLayer=false, lastTick=Date.now(), sinceSave=0, goalToastDay=null;
const isRunning=()=> (freeSession||inLayer) && !document.hidden;
setInterval(()=>{
  const now=Date.now(); const dt=Math.min(5,(now-lastTick)/1000); lastTick=now;
  if(!isRunning()) return;
  const d=dayRec(todayKey()); const before=d.sec; d.sec+=dt; sinceSave+=dt;
  const goal=S.goalMin*60;
  if(before<goal && d.sec>=goal && goalToastDay!==todayKey()){ goalToastDay=todayKey(); toast("Target "+S.goalMin+" menit hari ini tercapai. お疲れさま!"); save(true); }
  if(sinceSave>=20){sinceSave=0; save();}
  updateClock();
},1000);

function fmtClock(sec){sec=Math.floor(sec); return Math.floor(sec/60)+":"+pad(sec%60);}
function updateClock(){
  const d=S.days[todayKey()]; const sec=d?d.sec:0;
  document.querySelectorAll("[data-clock]").forEach(el=>el.textContent=fmtClock(sec));
  const ring=document.getElementById("ringArc");
  if(ring){ const p=Math.min(1,sec/(S.goalMin*60)); ring.setAttribute("stroke-dashoffset",String(RING_C*(1-p))); }
  const left=document.getElementById("leftTxt");
  if(left) left.textContent=leftText(sec);
}
const RING_C=2*Math.PI*56;
function leftText(sec){const r=S.goalMin*60-sec; return r<=0?"Target hari ini tercapai":"Sisa "+Math.ceil(r/60)+" menit lagi";}

/* ============================================================
   STREAK & STATISTIK
   ============================================================ */
function met(k){return (S.days[k]?.sec||0)>=S.goalMin*60;}
function streak(){
  const d=new Date(); let n=0;
  if(!met(keyOf(d))) d.setDate(d.getDate()-1);
  while(met(keyOf(d))){n++; d.setDate(d.getDate()-1);}
  return n;
}
function bestStreak(){
  const keys=Object.keys(S.days).filter(met).sort(); let best=0,run=0,prev=null;
  for(const k of keys){ const t=new Date(k+"T00:00"); if(prev&&(t-prev)/864e5<1.5) run++; else run=1; best=Math.max(best,run); prev=t; }
  return best;
}
function weakItems(){
  return Object.entries(S.items)
    .filter(([id,s])=>ITEMS[id] && s.wrong>0 && (s.streak||0)<3)
    .map(([id,s])=>({id,score:s.wrong*2-s.right*0.5-(s.streak||0)*2+((Date.now()-(s.last||0))/864e5)*0.2}))
    .sort((a,b)=>b.score-a.score).map(x=>x.id);
}

/* SRS: kotak Leitner. Benar → naik kotak (jeda makin panjang), salah → kembali ke kotak 1. */
const SRS_GAP=[0,1,2,4,7,15,30,60]; // hari
function addDays(k,n){const d=new Date(k+"T00:00"); d.setDate(d.getDate()+n); return keyOf(d);}
function srsAdd(ids){ids.forEach(id=>{ if(!S.srs[id]) S.srs[id]={box:1,due:addDays(todayKey(),1),t:Date.now()}; });}
function srsDue(){const t=todayKey(); return Object.entries(S.srs).filter(([id,c])=>ITEMS[id]&&c.due<=t).sort((a,b)=>a[1].box-b[1].box||(a[1].due<b[1].due?-1:1)).map(([id])=>id);}
function srsAnswer(id,ok){
  const c=S.srs[id]||(S.srs[id]={box:1,due:todayKey(),t:0});
  c.box=ok?Math.min(7,c.box+1):1; c.due=addDays(todayKey(),ok?SRS_GAP[c.box]:1); c.t=Date.now();
}
function srsNextDay(){const ds=Object.values(S.srs).map(c=>c.due).filter(d=>d>todayKey()).sort(); return ds[0]||null;}
function planInfo(){
  const start=S.planStart||todayKey();
  const week=Math.floor((new Date(todayKey()+"T00:00")-new Date(start+"T00:00"))/864e5/7)+1;
  const done=PLAN.filter(l=>S.lessons[l.id]).length, target=Math.min(PLAN.length,week*PACE), due=Math.min(PLAN.length,(week-1)*PACE);
  const left=PLAN.length-done, weeksLeft=Math.ceil(left/PACE);
  const end=new Date(); end.setDate(end.getDate()+weeksLeft*7);
  return {week,done,target,total:PLAN.length,diff:done<due?done-due:Math.max(0,done-target),thisWeek:Math.max(0,target-done),end,todo:PLAN.filter(l=>!S.lessons[l.id]).slice(0,Math.max(0,target-done)||Math.min(3,left))};
}

function chart(){
  const N=14,W=340,H=170,L=30,R=6,T=12,B=26; const goal=S.goalMin;
  const data=[...Array(N)].map((_,i)=>{const d=new Date(); d.setDate(d.getDate()-(N-1-i)); const k=keyOf(d); return {k,d,m:(S.days[k]?.sec||0)/60};});
  const max=Math.max(goal*1.5,...data.map(x=>x.m)); const top=Math.ceil(max/30)*30;
  const y=v=>T+(H-T-B)*(1-v/top); const bw=(W-L-R)/N;
  const ticks=[0,top/2,top].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v)}</text>`).join("");
  const bars=data.map((x,i)=>{const h=Math.max(x.m>0?2:0,y(0)-y(x.m)); const isT=i===N-1;
    const fill=x.m>=goal?"var(--ai)":"var(--ai-soft)";
    return `<rect x="${L+i*bw+bw*0.18}" y="${y(0)-h}" width="${bw*0.64}" height="${h}" rx="3" fill="${fill}"/>`+
      `<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${isT?"var(--fg)":"var(--muted)"}" font-weight="${isT?700:400}">${x.d.getDate()}</text>`;}).join("");
  const gl=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--shu)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-R}" y="${y(goal)-5}" text-anchor="end" font-size="10" fill="var(--shu)" font-weight="700">target ${goal} mnt</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Menit belajar per hari, 14 hari terakhir">${ticks}${bars}${gl}</svg>`;
}

let jaVoice=null, voiceCount=0, lastTts="", curUtt=null;
function loadVoice(){try{const vs=speechSynthesis.getVoices(); voiceCount=vs.length; jaVoice=vs.find(v=>/^ja([-_]|$)/i.test(v.lang))||null;}catch(e){}}
if("speechSynthesis" in window){loadVoice(); try{speechSynthesis.addEventListener("voiceschanged",loadVoice);}catch(e){speechSynthesis.onvoiceschanged=loadVoice;}}
function speak(text){
  if(!("speechSynthesis" in window)){lastTts="Browser tidak mendukung suara"; toast("Browser ini belum mendukung suara. Pakai Chrome."); return;}
  try{
    loadVoice();
    const ss=speechSynthesis; if(ss.speaking||ss.pending) ss.cancel(); ss.resume();
    const u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=.85; u.volume=1; if(jaVoice) u.voice=jaVoice;
    curUtt=u; // simpan referensi: Chrome kadang membuang ucapan yang tidak dirujuk
    u.onstart=()=>{lastTts="Berhasil diputar";};
    u.onerror=ev=>{lastTts="Gagal: "+ev.error; if(ev.error!=="interrupted"&&ev.error!=="canceled") toast("Suara gagal diputar ("+ev.error+"). Buka Progres → Tes suara.");};
    setTimeout(()=>ss.speak(u),60); // jeda kecil setelah cancel, mencegah ucapan tertelan di Chrome Android
    if(!jaVoice && !speak.warned) setTimeout(()=>{loadVoice(); if(!jaVoice && !speak.warned){speak.warned=true; toast("Suara Jepang belum terpasang di HP ini. Buka Progres → Tes suara untuk caranya.");}},1200);
  }catch(e){lastTts="Gagal: "+e; toast("Suara gagal diputar. Buka Progres → Tes suara.");}
}
function voiceCard(){
  loadVoice();
  const ok="speechSynthesis" in window;
  return `<section class="card" style="display:grid;gap:10px"><div class="row between"><h2>Tes suara</h2><button class="btn primary" data-act="tts-test">Putar こんにちは</button></div>
  <p class="muted" style="margin:0;font-size:14px" id="ttsInfo">${!ok?"Browser ini tidak mendukung suara.":`${voiceCount} suara terpasang · suara Jepang: <b>${jaVoice?esc(jaVoice.name):"tidak ditemukan"}</b>${lastTts?" · terakhir: "+esc(lastTts):""}`}</p>
  <div class="row between" style="border-top:1px solid var(--line);padding-top:10px"><h2>Tes mikrofon</h2><button class="btn primary" data-act="mic-test">Mulai</button></div>
  <p class="muted" style="margin:0;font-size:14px" id="micInfo">${SR?"Tekan Mulai, lalu ucapkan こんにちは.":"Browser ini tidak mendukung pengenal suara. Pakai Chrome di Android."}</p>
  <details><summary style="cursor:pointer;font-weight:600">Tidak ada suara? Cek ini</summary><ol style="margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px">
    <li>Naikkan <b>volume media</b> (bukan volume dering) dan matikan mode senyap.</li>
    <li>Buka <b>Setelan HP → Aksesibilitas → Output text-to-speech</b>. Pilih mesin <b>Speech Services by Google</b>.</li>
    <li>Ketuk ikon roda gigi di sebelahnya → <b>Instal data suara</b> → <b>Japanese (日本語)</b> → unduh.</li>
    <li>Tutup Chrome sepenuhnya, buka aplikasi lagi, lalu tekan tombol tes di atas.</li>
  </ol></details></section>`;
}

let Q=null; // {mode, lesson, steps:[{type:"learn"|"quiz"|"speak", item, ...}], i, right, wrong, answered}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- Pengenalan suara (latihan bicara) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=false, rec=null;
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const clean=s=>toHira(String(s).toLowerCase()).replace(/[\s、。！？!?,.・ー〜~「」]/g,"");
function listen(st){
  if(!SR||micBlocked) return;
  try{rec&&rec.abort();}catch(e){}
  rec=new SR(); rec.lang="ja-JP"; rec.maxAlternatives=5; rec.interimResults=false; rec.continuous=false;
  st.listening=true; st.heard=null; st.ok=null; st.err=null; renderLayer();
  let got=false;
  rec.onresult=ev=>{
    got=true; lastMic="ok"; const alts=[...ev.results[0]].map(a=>a.transcript);
    const target=clean(st.item.kana||st.item.jp), written=clean(st.item.jp), rom=st.item.romaji.toLowerCase();
    const ok=alts.some(a=>{const c=clean(a); return c.includes(target)||c.includes(written)||c===rom||c===rom+rom;});
    st.heard=alts[0]||""; st.ok=ok; st.tries=(st.tries||0)+1;
    if(st.tries===1||ok) recordSpeech(st.item,ok);
  };
  rec.onerror=ev=>{
    lastMic=ev.error;
    if(ev.error==="not-allowed"&&!onGithub()){micBlocked=true; st.err="blocked";}
    else if(ev.error==="no-speech") st.err="nospeech";
    else if(ev.error!=="aborted"){st.err="other"; st.errCode=ev.error;}
  };
  rec.onend=()=>{ st.listening=false; if(!got&&!st.err) st.err="nospeech"; if(Q&&Q.steps[Q.i]===st) renderLayer(); };
  try{rec.start();}catch(e){st.listening=false; st.err="other"; renderLayer();}
}
function recordSpeech(item,ok){
  const s=S.items[item.id]||(S.items[item.id]={right:0,wrong:0,streak:0,last:0});
  ok?s.sRight=(s.sRight||0)+1:s.sWrong=(s.sWrong||0)+1;
  const d=dayRec(todayKey()); ok?d.sRight=(d.sRight||0)+1:d.sWrong=(d.sWrong||0)+1;
  ok?Q.sRight++:Q.sWrong++; save();
}

function makeQuiz(item){
  if(item.kind==="grammar") return {type:"quiz",item,answer:item.answer,options:shuffle([item.answer,...item.distract]),jpOpts:true,mode:"gram"};
  const pool=Object.values(ITEMS).filter(x=>x.kind===item.kind&&x.id!==item.id&&(item.kind!=="kana"||x.id[0]===item.id[0]));
  let mode;
  if(item.kind==="kana") mode="read";
  else if(item.kind==="kanji") mode=Math.random()<.5?"meaning":"exread";
  else mode=Math.random()<.5?"reverse":"meaning";
  const label=x=>mode==="read"?x.romaji:mode==="reverse"?x.jp:mode==="exread"?x.exKana:x.arti;
  // pengecoh diutamakan dari pelajaran yang sama supaya kuis tetap menantang
  const near=shuffle(pool.filter(x=>x.lesson===item.lesson)), far=shuffle(pool.filter(x=>x.lesson!==item.lesson));
  const distract=[...near,...far].map(label).filter((v,i,a)=>v&&v!==label(item)&&a.indexOf(v)===i).slice(0,3);
  return {type:"quiz",item,mode,reverse:mode==="reverse",answer:label(item),options:shuffle([label(item),...distract]),jpOpts:mode==="reverse"||mode==="exread"};
}

function finish(){
  const total=Q.right+Q.wrong, sTotal=Q.sRight+Q.sWrong;
  const pct=total?Math.round(Q.right/total*100):sTotal?Math.round(Q.sRight/sTotal*100):0;
  if(Q.mode==="lesson"){
    const p=S.lessons[Q.lesson.id]||(S.lessons[Q.lesson.id]={times:0,best:0,last:0});

const TALK_SCHEMA={type:"object",additionalProperties:false,required:["jp","kana","id","correction","praise","hint"],properties:{
  jp:{type:"string"},kana:{type:"string"},id:{type:"string"},praise:{type:"string"},hint:{type:"string"},

function apiAI(key){
  let clientP=null;
  const client=()=>clientP||(clientP=import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.135.0/+esm").then(m=>new (m.default||m.Anthropic)({apiKey:key,dangerouslyAllowBrowser:true})));
  return {json:async turns=>{
    let c; try{ c=await client(); }catch(e){ throw {code:"sdk_load"}; }
    try{
      const res=await c.beta.messages.create({
        model:"claude-opus-5-5", max_tokens:2000,
        betas:["server-side-fallback-2026-07-01"], fallbacks:"default",
        output_config:{effort:"low",format:{type:"json_schema",schema:TALK_SCHEMA}},
        system:turns[0].content, messages:turns.slice(1)
      });
      if(res.stop_reason==="refusal") throw {code:"refused"};
      const txt=(res.content.find(b=>b.type==="text")||{}).text||"";
      return JSON.parse(txt);
    }catch(e){
      if(e&&e.code) throw e;
      const st=e&&e.status; throw {code:st===401?"bad_key":st===429?"rate_limited":st===400&&/credit/i.test(e.message||"")?"no_credit":"api_error",detail:e&&e.message};
    }
  }};
}

      <li>Buka <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>, masuk, lalu isi saldo (Billing).</li>
      <li>Buat API key baru, lalu salin.</li>
      <li>Tempel di bawah dan tekan Simpan. Key hanya tersimpan di HP ini.</li></ol>
    <form id="keyForm" class="talkbar"><input id="keyInput" type="password" autocomplete="off" placeholder="sk-ant-…" style="flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)"><button class="btn primary" type="submit">Simpan</button></form>
    <p class="muted" style="margin:0;font-size:13px">Tanpa API key, pakai versi claude.ai dari aplikasi ini (gratis, lewat paket Claude-mu).</p></section>`;
  }
  return head+`<section class="card" style="display:grid;gap:10px">
    <p style="margin:0">Pilih situasi. Partner AI berbicara bahasa Jepang seperti penutur asli dan mengoreksi kesalahanmu dalam bahasa Indonesia.</p>
    <div class="row" style="flex-wrap:wrap;gap:8px"><span class="muted" style="font-size:13px">Tingkat</span>${["N5","N4"].map(l=>`<button class="chip ${talkLevel===l?"good":""}" data-act="level" data-level="${l}" aria-pressed="${talkLevel===l}">${l}</button>`).join("")}</div>
    <p class="muted" style="margin:0;font-size:13px">${SR&&!micBlocked?"Tekan tombol mikrofon untuk bicara, atau ketik.":"Untuk bicara: ketuk kolom ketik, lalu tekan ikon mikrofon di keyboard HP (Gboard), dan ucapkan dalam bahasa Jepang. Pasang bahasa Jepang di Gboard lewat Setelan Gboard → Bahasa."}</p>
  </section>
  <div class="scenes">${SCENES.map(sc=>`<button class="scene" data-act="talk" data-scene="${sc.id}"><span class="jp">${sc.jp}</span><b>${esc(sc.title)}</b><span class="muted">${esc(sc.desc)}</span></button>`).join("")}</div>
  ${sessions?`<p class="muted" style="margin:0;text-align:center;font-size:13px">${sessions} percakapan sudah kamu selesaikan</p>`:""}
  ${aiSource==="api"?`<p class="muted" style="margin:0;text-align:center;font-size:13px">Memakai API key di HP ini · <button class="linkbtn" data-act="key-remove">Hapus API key</button></p>`:""}`;
}

function talkInstructions(sc){
  return `Kamu adalah partner latihan percakapan bahasa Jepang untuk Rinji, orang Indonesia yang belajar dari nol dengan target JLPT N4. Peranmu: ${sc.role}. Situasi: ${sc.title} (${sc.desc}).

Aturan:
- Bicaralah seperti penutur asli Jepang yang ramah dan natural, tetapi sesuaikan dengan tingkat ${talkLevel}: ${talkLevel==="N5"?"kalimat pendek, bentuk です/ます, kosakata dasar N5, kanji sedikit":"bentuk sopan dan sesekali bentuk biasa, kosakata dan tata bahasa sampai N4"}.
- Satu giliran berisi 1–2 kalimat saja, lalu ajukan pertanyaan atau beri kesempatan Rinji menjawab supaya percakapan berlanjut.
- BAHASA: percakapan peranmu (field "jp") dalam bahasa Jepang. SEMUA koreksi, penjelasan, pujian, dan terjemahan (field "explain", "praise", "id", serta arti di "hint") WAJIB dalam bahasa Indonesia. Jangan pernah menulis penjelasan dalam bahasa Jepang atau Inggris.
- Periksa pesan terakhir Rinji: tata bahasa, kosakata, partikel, bentuk sopan, dan kewajaran. Jika ada kesalahan, isi "correction": "wrong" = bagian yang salah, "right" = versi benar dalam bahasa Jepang, "explain" = penjelasan dalam bahasa Indonesia yang mudah dipahami pemula: apa yang salah, kenapa, dan aturannya. Contoh explain: "Partikel topik ditulis は (dibaca 'wa'), bukan わ. Jadi: わたしは リンジです." Jika pesannya dalam romaji, beri tahu tulisan kananya. Jika ia menulis dalam bahasa Indonesia, bantu ia mengatakannya dalam bahasa Jepang lalu lanjutkan percakapan.
- Teks dari Rinji mungkin hasil pengenalan suara, jadi abaikan salah ketik kecil yang jelas berasal dari pengenal suara.
- Jangan keluar dari peran kecuali untuk koreksi.

Jawab HANYA dengan satu objek JSON, tanpa teks lain:
{"jp":"jawabanmu dalam bahasa Jepang","kana":"jawaban yang sama, seluruhnya hiragana/katakana","id":"terjemahan bahasa Indonesia","correction":null atau {"wrong":"bagian Rinji yang salah","right":"versi yang benar dalam bahasa Jepang","explain":"penjelasan singkat dalam bahasa Indonesia"},"praise":"pujian singkat dalam bahasa Indonesia bila jawaban Rinji sudah benar, atau string kosong","hint":"contoh jawaban sederhana yang bisa Rinji ucapkan berikutnya, dalam bahasa Jepang + arti dalam kurung"}`;
}
function startTalk(id){
  const sc=SCENES.find(x=>x.id===id); if(!sc||!AI) return;
  Q=newQ({mode:"talk",lesson:{title:sc.jp+" · "+sc.title},scene:sc,msgs:[],busy:false,steps:[]});
  openLayer(); talkSend(null);
}
function talkPayload(){
  const turns=[{role:"user",content:talkInstructions(Q.scene)}];
  const hist=Q.msgs.slice(-20); // jaga agar tetap ringkas
  if(!hist.length||hist[0].role!=="user") turns.push({role:"user",content:"(Mulai percakapan: sapa Rinji dan buka situasinya. correction harus null.)"});
  hist.forEach(m=>turns.push({role:m.role,content:m.role==="user"?m.text:JSON.stringify(m.data)}));
  return turns;
}
async function talkSend(text){
  if(!Q||Q.mode!=="talk"||Q.busy) return;
  if(text!=null){ text=text.trim(); if(!text) return; Q.msgs.push({role:"user",text}); }
  Q.busy=true; Q.err=null; renderLayer(); scrollChat();
  try{
    const data=await AI.json(talkPayload(),{cache:false});
    if(!data||typeof data.jp!=="string") throw {code:"invalid_json"};
    Q.msgs.push({role:"assistant",data});
    if(text!=null){ if(data.correction) Q.wrong++; else Q.right++; }
    speak(data.jp);
  }catch(e){
    Q.err=({rate_limited:"Batas pemakaian Claude tercapai. Coba lagi nanti.",not_granted:"Izin untuk memakai Claude belum diberikan. Buka menu izin halaman ini, lalu izinkan.",sampling_disabled:"Fitur AI dimatikan untuk akun ini.",bad_key:"API key tidak valid. Hapus lalu masukkan ulang di tab Bicara.",no_credit:"Saldo akun API habis. Isi saldo di console.anthropic.com.",sdk_load:"Gagal memuat penghubung AI. Periksa internet lalu coba lagi.",refused:"AI menolak menjawab pesan ini. Coba kalimat lain.",invalid_json:"Jawaban AI tidak terbaca. Tekan Kirim ulang."})[e&&e.code]||"Gagal menghubungi AI. Periksa internet, lalu tekan Kirim ulang.";
    Q.retry=text;
    if(text!=null) Q.msgs.pop();
  }
  Q.busy=false; renderLayer(); scrollChat();
}
function scrollChat(){const b=document.querySelector(".layer-body"); if(b) b.scrollTop=b.scrollHeight;}
function talkListen(){
  if(!SR||micBlocked||Q.busy) return;
  try{rec&&rec.abort();}catch(e){}
  const r=new SR(); rec=r; r.lang="ja-JP"; r.interimResults=true; r.continuous=false;
  const box=document.getElementById("talkInput"); Q.listening=true; renderMicBtn();
  r.onresult=ev=>{ const t=[...ev.results].map(x=>x[0].transcript).join(""); if(box) box.value=t; };
  r.onerror=ev=>{ if(ev.error==="not-allowed"&&!onGithub()) micBlocked=true; if(ev.error!=="aborted"&&ev.error!=="no-speech") toast(micErrText(ev.error)); };
  r.onend=()=>{ Q.listening=false; renderMicBtn(); const v=box&&box.value.trim(); if(v){ box.value=""; talkSend(v); } };
  try{r.start();}catch(e){Q.listening=false; renderMicBtn();}
}
function renderMicBtn(){const b=document.getElementById("talkMic"); if(b) b.classList.toggle("on",!!Q?.listening);}
function talkBody(){
  const bubbles=Q.msgs.map((m,i)=>{
    if(m.role==="user") return `<div class="bub me">${esc(m.text)}</div>`;
    const d=m.data, last=i===Q.msgs.length-1;
    const corr=d.correction&&d.correction.right?`<div class="corr"><span class="eyebrow" style="color:var(--bad)">Koreksi · penjelasan</span><div>${d.correction.wrong?`<s>${esc(d.correction.wrong)}</s> → `:""}<b class="jp">${esc(d.correction.right)}</b></div><div>${esc(d.correction.explain||"")}</div></div>`:d.praise?`<div class="praise">${esc(d.praise)}</div>`:"";
    return `${corr}<div class="bub ai"><div class="jp" style="font-size:18px;font-weight:700">${esc(d.jp)}</div>${d.kana&&d.kana!==d.jp?`<div class="muted jp" style="font-size:13px">${esc(d.kana)}</div>`:""}
      <details ${talkLevel==="N5"?"open":""}><summary>Arti</summary>${esc(d.id||"")}</details>
      <div class="row" style="gap:8px"><button class="speak" data-say="${esc(d.jp)}">Dengar ▸</button></div>
      ${last&&d.hint?`<div class="hint"><span class="eyebrow">Contoh jawaban</span><div class="jp">${esc(d.hint)}</div></div>`:""}</div>`;
  }).join("");
  return `<div class="chat">${bubbles}${Q.busy?`<div class="bub ai typing">…</div>`:""}${Q.err?`<div class="feedback wrong">${esc(Q.err)} <button class="btn" data-act="talk-retry" style="margin-top:8px">Kirim ulang</button></div>`:""}</div>`;
}
function talkFoot(){
  const canMic=SR&&!micBlocked;
  return `<form class="talkbar" id="talkForm">${canMic?`<button type="button" class="mic small" id="talkMic" data-act="talk-mic" aria-label="Bicara">${MIC_SVG}</button>`:""}
    <textarea id="talkInput" rows="1" lang="ja" placeholder="${canMic?"Bicara atau ketik…":"Ketik, atau pakai mikrofon keyboard…"}" ${Q.busy?"disabled":""}></textarea>
    <button class="btn primary" type="submit" ${Q.busy?"disabled":""}>Kirim</button></form>
    <button class="btn block" data-act="talk-end" style="margin-top:8px">Selesai percakapan</button>`;
}

/* ============================================================
   INTERAKSI
   ============================================================ */
function toast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3500);}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-tab]"); if(!b) return;
  if(b.dataset.tab){tab=b.dataset.tab; render(); window.scrollTo(0,0); return;}
  if(b.dataset.lesson){startLesson(b.dataset.lesson); return;}
  if(b.dataset.say){speak(b.dataset.say); return;}
  if(b.dataset.opt!=null && Q && !Q.answered){
    const st=Q.steps[Q.i]; Q.answered=b.dataset.opt; const ok=Q.answered===st.answer; recordAnswer(st.item,ok);
    if(st.mode==="meaning"&&st.item.kind!=="kanji"||st.mode==="read") speak(st.item.jp); else if(st.mode==="gram") speak(st.item.jp.replace("＿",st.item.answer)); else if(st.mode==="exread") speak(st.item.ex); renderLayer(); return;
  }
  const act=b.dataset.act;
  if(act==="free"){freeSession=!freeSession; lastTick=Date.now(); render(); toast(freeSession?"Sesi bebas berjalan. Waktu belajar dari buku atau video ikut tercatat.":"Sesi bebas dijeda.");}
  else if(act==="review"){startReview(false);}
  else if(act==="srs"){ if(Q){closeLayer();} startSRS(); }
  else if(act==="review-all"){startReview(true);}
  else if(act==="next"&&Q){try{rec&&rec.abort();}catch(e){} Q.answered=null; Q.i++; if(Q.i>=Q.steps.length) finish(); else renderLayer();}
  else if(act==="mic-test"){micTest();}
  else if(act==="talk"){ const id=b.dataset.scene; if(Q) {Q=null;} if(!inLayer) startTalk(id); else {startTalk(id);} }
  else if(act==="key-remove"){ try{localStorage.removeItem(KEY_LS);}catch(e){} if(aiSource==="api"){AI=null; aiSource="";} render(); toast("API key dihapus dari HP ini."); }
  else if(act==="level"){ talkLevel=b.dataset.level; render(); }
  else if(act==="talk-mic"){ talkListen(); }
  else if(act==="talk-end"&&Q){ try{rec&&rec.abort();}catch(e){} finishTalk(); }
  else if(act==="talk-retry"&&Q){ const t=Q.retry; Q.err=null; talkSend(t); }
  else if(act==="tts-test"){speak("こんにちは"); setTimeout(()=>{const el=document.getElementById("ttsInfo"); if(el&&tab==="stats") render();},1500);}
  else if(act==="listen"&&Q){listen(Q.steps[Q.i]);}
  else if(act==="skip-speak"&&Q){Q.steps=Q.steps.filter((s,i)=>i<Q.i||s.type!=="speak"); if(Q.i>=Q.steps.length) finish(); else renderLayer();}
  else if(act==="speak-lesson"){startSpeak(b.dataset.id);}
  else if(act==="table"){openTable(b.dataset.script);}
  else if(act==="again-speak"&&Q){const id=Q.lesson.id; Q=null; startSpeak(id);}
  else if(act==="close"){closeLayer();}
  else if(act==="again"&&Q){const id=Q.lesson.id; Q=null; startLesson(id);}
  else if(act==="again-review"){Q=null; startReview(weakItems().length===0);}
});
document.addEventListener("submit",e=>{ if(e.target.id==="keyForm"){ e.preventDefault(); const v=document.getElementById("keyInput").value.trim(); if(!/^sk-ant-/.test(v)){toast("API key biasanya diawali sk-ant-. Periksa lagi."); return;} try{localStorage.setItem(KEY_LS,v);}catch(err){} setupAI(); render(); toast("API key tersimpan di HP ini."); } });
document.addEventListener("submit",e=>{ if(e.target.id==="talkForm"){ e.preventDefault(); const t=document.getElementById("talkInput"); const v=t.value; t.value=""; talkSend(v);} });
document.addEventListener("keydown",e=>{ if(e.target.id==="talkInput"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); e.target.form.requestSubmit(); } });
document.addEventListener("toggle",e=>{const u=e.target.dataset?.unit; if(!u) return; e.target.open?openUnits.add(u):openUnits.delete(u);},true);
document.addEventListener("change",e=>{ if(e.target.id==="goalSel"){S.goalMin=+e.target.value; save(true); render();} });
document.addEventListener("visibilitychange",()=>{lastTick=Date.now();});
render();
</script>
